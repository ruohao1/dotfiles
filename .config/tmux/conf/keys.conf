# Canonical prefix. Press Meta-Space twice to send it to the active pane.
unbind-key C-Space
unbind-key C-b
bind-key M-Space send-prefix

# Remove default or legacy aliases for remapped actions.
unbind-key d
unbind-key c
unbind-key n
unbind-key p
unbind-key M-n
unbind-key M-p
unbind-key 0
unbind-key 1
unbind-key 2
unbind-key 3
unbind-key 4
unbind-key 5
unbind-key 6
unbind-key 7
unbind-key 8
unbind-key 9
unbind-key ','
unbind-key '&'
unbind-key '"'
unbind-key '%'
unbind-key s
unbind-key w
unbind-key h
unbind-key j
unbind-key k
unbind-key l
unbind-key Up
unbind-key Down
unbind-key Left
unbind-key Right
unbind-key C-Up
unbind-key C-Down
unbind-key C-Left
unbind-key C-Right
unbind-key M-Up
unbind-key M-Down
unbind-key M-Left
unbind-key M-Right
unbind-key x
unbind-key z
unbind-key '['
unbind-key Tab
unbind-key -n M-H
unbind-key -n M-J
unbind-key -n M-K
unbind-key -n M-L

# Prefix actions shared with Herdr.
bind-key ? list-keys
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux foundation"
bind-key Q detach-client
bind-key f choose-tree -Zw
bind-key r switch-client -T resize
bind-key v copy-mode

# Read restored geometry while zoomed, then restore zoom after every outcome.
bind-key H if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z ; if-shell -F "#{pane_at_left}" "resize-pane -Z ; display-message \"No pane left\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{left-of}'\'' ; select-pane -t '\''#{pane_id}'\'' ; resize-pane -Z -t '\''#{pane_id}'\''\""' \
  'if-shell -F "#{pane_at_left}" "display-message \"No pane left\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{left-of}'\'' ; select-pane -t '\''#{pane_id}'\''\""'
bind-key J if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z ; if-shell -F "#{pane_at_bottom}" "resize-pane -Z ; display-message \"No pane down\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{down-of}'\'' ; select-pane -t '\''#{pane_id}'\'' ; resize-pane -Z -t '\''#{pane_id}'\''\""' \
  'if-shell -F "#{pane_at_bottom}" "display-message \"No pane down\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{down-of}'\'' ; select-pane -t '\''#{pane_id}'\''\""'
bind-key K if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z ; if-shell -F "#{pane_at_top}" "resize-pane -Z ; display-message \"No pane up\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{up-of}'\'' ; select-pane -t '\''#{pane_id}'\'' ; resize-pane -Z -t '\''#{pane_id}'\''\""' \
  'if-shell -F "#{pane_at_top}" "display-message \"No pane up\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{up-of}'\'' ; select-pane -t '\''#{pane_id}'\''\""'
bind-key L if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z ; if-shell -F "#{pane_at_right}" "resize-pane -Z ; display-message \"No pane right\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{right-of}'\'' ; select-pane -t '\''#{pane_id}'\'' ; resize-pane -Z -t '\''#{pane_id}'\''\""' \
  'if-shell -F "#{pane_at_right}" "display-message \"No pane right\"" "run-shell -C \"swap-pane -Z -s '\''#{pane_id}'\'' -t '\''{right-of}'\'' ; select-pane -t '\''#{pane_id}'\''\""'

# Freeze only the source number, then rebuild its percent after tree substitution.
bind-key m run-shell -C \
  "choose-tree -Zw \"run-shell -C \\\"move-pane -h -s '##{a:37}#{s/%//:pane_id}' -t '%%'\\\"\""

# Direct tab actions. tmux windows are the equivalent of Herdr tabs.
bind-key -n M-n new-window -c '#{pane_current_path}'
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-r command-prompt -I '#W' "rename-window -- '%%'"
bind-key -n M-Q kill-window

# Let smart-splits navigate Neovim first and hand off to tmux at editor edges.
bind-key -n 'M-\' split-window -h -c '#{pane_current_path}'
bind-key -n 'M-|' split-window -v -c '#{pane_current_path}'
bind-key -n M-h if-shell -F '#{@pane-is-vim}' 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell -F '#{@pane-is-vim}' 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell -F '#{@pane-is-vim}' 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell -F '#{@pane-is-vim}' 'send-keys M-l' 'select-pane -R'
bind-key -n M-q confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind-key -n M-f resize-pane -Z

# Forward Ctrl-primary events and open only completed URL clicks.
%if "#{m/r:^(3[.]([7-9]|[1-9][0-9]+)|([4-9]|[1-9][0-9]+)[.][0-9]+)[[:alnum:]._-]*$,#{version}}"
bind-key -n C-MouseDown1Pane send-keys -M
bind-key -n C-MouseUp1Pane send-keys -M \; run-shell -b -t = \
  '~/.config/tmux/scripts/open-url --pane #{mouse_pane} --x #{mouse_x} --y #{mouse_y} --hyperlink #{?mouse_hyperlink,1,0} || :'
%endif

# Modal one-cell pane resizing. Escape returns to the root table.
unbind-key -a -q -T resize
bind-key -T resize h resize-pane -L 1 \; switch-client -T resize
bind-key -T resize j resize-pane -D 1 \; switch-client -T resize
bind-key -T resize k resize-pane -U 1 \; switch-client -T resize
bind-key -T resize l resize-pane -R 1 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root

# Vi copy mode uses tmux's native copy commands.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
