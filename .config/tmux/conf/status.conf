# One native TokyoNight Night status row; no theme or statusline plugin.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-left-length 48
set -g status-right-length 48
set -g status-style 'fg=#a9b1d6,bg=#1A1B26'
set -g status-left-style 'fg=#a9b1d6,bg=#1A1B26'
set -g status-right-style 'fg=#a9b1d6,bg=#1A1B26'
set -gw monitor-activity on
set -gw monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g window-status-separator ''
set -g window-status-style 'fg=#787c99,bg=#1A1B26'
set -g window-status-current-style 'fg=#a9b1d6,bg=#2A2F41,bold'
set -g window-status-activity-style 'fg=#7dcfff,bg=#1A1B26'
set -g window-status-bell-style 'fg=#f7768e,bg=#1A1B26'
set -g window-status-format '#[fg=#787c99,bg=#1A1B26]#{?window_zoomed_flag,#[fg=#787c99#,bg=#1A1B26]#[fg=#1A1B26#,bg=#787c99]#{window_index}#[fg=#787c99#,bg=#1A1B26], #{window_index} }#{?#{e|>=:#{client_width},120},#{=12:#{qh:window_name}},#{?#{e|>=:#{client_width},100},#{=10:#{qh:window_name}},#{=5:#{qh:window_name}}}}#{?window_activity_flag,#[fg=#7dcfff#,bg=#1A1B26]•#[fg=#787c99#,bg=#1A1B26],}#{?window_bell_flag,#[fg=#f7768e#,bg=#1A1B26]!#[fg=#787c99#,bg=#1A1B26],} #[default]'
